<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Create an Offer - Hazel</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body class="app-shell">

  <!-- Wizard top bar: breadcrumb + discard -->
  <header class="wizard-topbar">
    <div class="container wizard-topbar-inner">
      <div class="crumb">
        <div class="crumb-icon">
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <a href="index.html">Offers</a>
        <span class="sep">&rsaquo;</span>
        <span class="current">Create an Offer</span>
      </div>
      <div class="discard">
        <svg viewBox="0 0 24 24" fill="none"><path d="M19 12H5M11 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Discard
      </div>
    </div>
  </header>

  <main class="wizard-container page" style="padding-top:0">

    <div class="wizard-page-head">
      <div>
        <div class="h2">Create an Offer</div>
        <p>Follow the steps to configure and publish a new offer&hellip;</p>
      </div>
      <button class="btn btn-secondary">
        <svg viewBox="0 0 24 24" fill="none"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z" stroke="currentColor" stroke-width="2"/></svg>
        Save as template
      </button>
    </div>

    <!-- numbered stepper -->
    <div class="owizard-steps" id="stepper"></div>

    <div class="owizard-card">
      <div class="owizard-body" id="stepBody">
        <!-- injected per step -->
      </div>
      <div class="owizard-foot">
        <button class="btn btn-ghost" id="btnBack">
          <svg viewBox="0 0 24 24" fill="none"><path d="M19 12H5M11 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Back
        </button>
        <div class="step-progress">
          <div class="cap" id="stepCap">Step 1 of 5</div>
          <div class="progress-dots" id="progressDots"></div>
        </div>
        <button class="btn btn-primary btn-pill" id="btnNext">
          Continue
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

  </main>

<script>
const STEPS = ["Who?","Eligibility","Details","Benefits","Categories"];
let current = 0; // 0-indexed

/* ---------- stepper ---------- */
function renderStepper(){
  const el = document.getElementById('stepper');
  el.innerHTML = STEPS.map((label,i)=>{
    const state = i < current ? 'done' : (i === current ? 'active' : '');
    const circle = i < current
      ? `<svg viewBox="0 0 24 24" fill="none" width="14" height="14"><path d="M20 6 9 17l-5-5" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      : (i+1);
    let html = `<div class="owizard-step ${state}"><div class="circle">${circle}</div><div class="lbl">${label}</div></div>`;
    if(i < STEPS.length-1){
      html += `<div class="owizard-line ${i < current ? 'done':''}"></div>`;
    }
    return html;
  }).join('');
}

function renderFooter(){
  document.getElementById('stepCap').textContent = `Step ${current+1} of ${STEPS.length}`;
  document.getElementById('progressDots').innerHTML = STEPS.map((_,i)=>`<span class="${i<=current?'done':''}"></span>`).join('');
  document.getElementById('btnBack').style.visibility = current === 0 ? 'hidden' : 'visible';
  document.getElementById('btnNext').innerHTML = current === STEPS.length-1
    ? `<svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M20 6 9 17l-5-5" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg> Preview & Publish`
    : `Continue <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

/* ---------- step content ---------- */
function iconInfo(){
  return `<svg viewBox="0 0 24 24" fill="none" width="13" height="13"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M12 11v5M12 8h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
}
function iconChev(){
  return `<svg class="chev" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function iconChevSm(){
  return `<svg class="chev-sm" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function iconCheck(){
  return `<svg viewBox="0 0 24 24" fill="none"><path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function iconX(){
  return `<svg viewBox="0 0 24 24" fill="none"><path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

const CORE_GROUPS = [
  {code:'CL', id:'care', title:'Care experienced people', desc:'Set location and age eligibility for care-experienced people.'}
];
const OTHER_GROUPS = [
  {code:'FC', id:'foster_carer', title:'Foster carer', desc:'Support children or young people in foster care.'},
  {code:'KC', id:'kinship_carer', title:'Kinship carer', desc:'Care for a child or young person through a family or connected-person arrangement.'},
  {code:'SWK', id:'support_worker', title:'Support worker', desc:'Support care-experienced people with practical, emotional or community support.'},
  {code:'SW', id:'social_worker', title:'Social worker', desc:'Support children in care or those leaving care.'},
  {code:'IV', id:'ind_visitor', title:'Independent visitor', desc:'Visit and support children in care.'},
  {code:'A', id:'advocate', title:'Advocate', desc:'Advocate for and support children or young people in care.'},
  {code:'LC', id:'leaving_care_prof', title:'Leaving care professional', desc:'Work in or support a leaving care service.'},
  {code:'PA', id:'leaving_care_pa', title:'Leaving Care PAs', desc:'Support young people preparing for adulthood and independence.'}
];

/* Step 1 selection state: "care experienced" is its own toggle, everything
   else is a multi-select set - both are genuinely clickable, matching the
   real Figma Make behaviour rather than a static mockup. */
let who1 = { care: true, members: new Set() };

function toggleCare(){
  who1.care = !who1.care;
  refreshStepBody();
}
function toggleMember(id){
  if(who1.members.has(id)) who1.members.delete(id); else who1.members.add(id);
  refreshStepBody();
}
function refreshStepBody(){
  document.getElementById('stepBody').innerHTML = RENDERERS[current]();
}

function stepWho(){
  const chips = [];
  if(who1.care) chips.push(`<span class="chip-removable">Care experienced people <button onclick="toggleCare()">${iconX()}</button></span>`);
  OTHER_GROUPS.filter(g=>who1.members.has(g.id)).forEach(g=>{
    chips.push(`<span class="chip-removable">${g.title} <button onclick="toggleMember('${g.id}')">${iconX()}</button></span>`);
  });
  return `
    <div class="h4">Who is this offer for?</div>
    <p class="intro">Select the groups that can access this offer.</p>
    ${CORE_GROUPS.map(g=>`
      <div class="nav-row ${who1.care?'selected':''}" onclick="toggleCare()" role="checkbox" aria-checked="${who1.care}" tabindex="0">
        <div class="avatar ${who1.care?'avatar-primary':''}">${g.code}</div>
        <div class="body"><div class="title">${g.title}</div><div class="desc">${g.desc}</div></div>
        ${iconChev()}
      </div>`).join('')}
    <div class="hr"></div>
    <div class="label" style="margin-bottom:4px">Other member accounts</div>
    <p class="small" style="margin:0 0 16px">Select any other member groups that can access this offer.</p>
    ${OTHER_GROUPS.map(g=>{
      const active = who1.members.has(g.id);
      return `
      <div class="nav-row ${active?'selected':''}" onclick="toggleMember('${g.id}')" role="checkbox" aria-checked="${active}" tabindex="0">
        <div class="avatar ${active?'avatar-primary':''}">${g.code}</div>
        <div class="body"><div class="title">${g.title}</div><div class="desc">${g.desc}</div></div>
        ${iconChev()}
      </div>`;}).join('')}
    ${chips.length ? `<div style="margin-top:16px;display:flex;flex-wrap:wrap;gap:8px">${chips.join('')}</div>` : ''}
  `;
}

const QUALIFIERS = [
  {id:'relevant', label:'Relevant', desc:'A child who is being looked after by a local authority.'},
  {id:'former_relevant', label:'Former relevant', desc:'A young person aged 16&ndash;21 who was previously looked after.'},
  {id:'qualifying', label:'Qualifying', desc:'A person aged 16&ndash;25 who left care before age 16 or has special circumstances.'}
];
let qualifiers = new Set(['relevant']);
function toggleQualifier(id){
  if(qualifiers.has(id)) qualifiers.delete(id); else qualifiers.add(id);
  refreshStepBody();
}

const ELIG_ROWS = [
  {id:'corp_in', title:'Corporate parent - living in our area', desc:'Care-experienced people for whom we are the corporate parent and who currently live in our area.'},
  {id:'corp_out', title:'Corporate parent - living outside our area', desc:'Care-experienced people for whom we are the corporate parent but who currently live outside our area.'},
  {id:'corp_another', title:"Another authority's corporate parent - living in our area", desc:"Care-experienced people whose corporate parent is another local authority but who currently live in our area."}
];
let eligAnswers = { corp_in: null, corp_out: null, corp_another: null };
function setEligAnswer(id, val){
  eligAnswers[id] = (eligAnswers[id] === val) ? null : val;
  refreshStepBody();
}

function stepEligibility(){
  const answered = ELIG_ROWS.filter(r=>eligAnswers[r.id]!==null).length;
  const countBadgeClass = answered === ELIG_ROWS.length ? 'badge-success' : 'badge-neutral';
  return `
    <div class="h4">Eligibility</div>
    <p class="intro">Set access rules for each selected group.</p>
    <div style="display:flex;gap:10px;margin-bottom:20px">
      <span class="chip-removable" style="background:var(--primary-soft);color:var(--primary)">
        <span class="avatar avatar-sm avatar-primary" style="margin-right:2px">CL</span> Care experienced people
        <span class="badge ${countBadgeClass}" style="height:20px">${answered}/${ELIG_ROWS.length}</span>
      </span>
    </div>
    <div class="nav-row selected" style="cursor:default">
      <div class="avatar avatar-primary">CL</div>
      <div class="body"><div class="title">Care experienced people</div><div class="desc">Set location and age eligibility for care-experienced people.</div></div>
    </div>

    <div class="cols-2" style="margin-top:16px">
      <div class="subpanel" style="margin-top:0">
        <div class="subpanel-header" style="background:var(--panel-dark);border-bottom:none">
          <div class="title" style="color:#fff">Age eligibility</div>
        </div>
        <div class="subpanel-body">
          <p class="small" style="margin-top:0">Set the age range this offer is available to.</p>
          <div class="cols-2">
            <div class="field"><div class="label">Minimum age</div><input class="input" placeholder="e.g. 16" /></div>
            <div class="field"><div class="label">Maximum age</div><input class="input" placeholder="e.g. 25" /></div>
          </div>
        </div>
      </div>
      <div class="subpanel" style="margin-top:0">
        <div class="subpanel-header" style="background:var(--panel-dark);border-bottom:none">
          <div class="title" style="color:#fff">Care status qualifier</div>
        </div>
        <div class="subpanel-body" style="display:grid;gap:10px">
          ${QUALIFIERS.map(q=>{
            const active = qualifiers.has(q.id);
            return `
          <div class="option-card ${active?'selected':''}" onclick="toggleQualifier('${q.id}')" role="checkbox" aria-checked="${active}" tabindex="0">
            <div class="row"><span class="box" style="width:16px;height:16px;border-radius:4px;border:1px solid ${active?'var(--primary)':'var(--border)'};background:${active?'var(--primary)':'#fff'};display:inline-grid;place-items:center;margin-right:6px;flex:none">${active?iconCheck():''}</span><span class="title">${q.label}</span></div>
            <div class="desc">${q.desc}</div>
          </div>`;}).join('')}
        </div>
      </div>
    </div>

    ${ELIG_ROWS.map(r=>eligRow(r.id, r.title, r.desc)).join('')}
  `;
}
function eligRow(id, title, desc){
  const state = eligAnswers[id];
  const badge = state === 'yes' ? `<span class="badge badge-success elig-badge">Allowed</span>`
              : state === 'no' ? `<span class="badge badge-danger elig-badge">N/A</span>`
              : `<span class="elig-badge"></span>`;
  const yesOn = state === 'yes' ? 'on' : '';
  const noOn = state === 'no' ? 'on' : '';
  return `
    <div class="elig-card" style="margin-top:12px">
      <div class="elig-card-head">
        <svg viewBox="0 0 24 24" fill="none" width="16" height="16" style="color:var(--primary)"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11Z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="2"/></svg>
        <span class="elig-card-title">${title}</span>
        ${badge}
      </div>
      <div class="elig-card-body">
        <p class="small" style="margin:0 0 12px">${desc}</p>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div class="segmented">
            <button class="seg-btn yes ${yesOn}" onclick="setEligAnswer('${id}','yes')">${iconCheck()} Yes</button>
            <button class="seg-btn no ${noOn}" onclick="setEligAnswer('${id}','no')">${iconX()} No</button>
          </div>
          <button type="button" class="includes-toggle" onclick="toggleIncludes(this)">
            ${iconInfo()} <span class="txt">Includes</span> ${iconChevSm()}
          </button>
        </div>
        <div class="includes-panel" hidden>
          <p>${desc}</p>
        </div>
      </div>
    </div>
  `;
}

function stepDetails(){
  return `
    <div class="h4">Offer Details</div>
    <p class="intro">Define what the offer includes and how it appears to customers.</p>

    <div class="field" style="margin-bottom:18px">
      <div class="label">Offer Type<span class="req">*</span></div>
      <select class="select"><option>Select a type&hellip;</option></select>
    </div>
    <div class="field" style="margin-bottom:18px">
      <div class="label">Offer Title<span class="req">*</span></div>
      <input class="input" placeholder="e.g. Summer Work Experience Placement" />
    </div>
    <div class="field" style="margin-bottom:18px">
      <div class="label">Short Description</div>
      <textarea class="textarea" style="min-height:70px" placeholder="A brief summary shown on the offer card&hellip;"></textarea>
      <div class="help">Max 160 characters. Shown in search results and previews.</div>
    </div>
    <div class="field" style="margin-bottom:18px">
      <div class="label">Full Description</div>
      <div class="editor">
        <div class="editor-toolbar">
          <span class="ebtn">↺</span><span class="ebtn">↻</span><span class="sep"></span>
          <span class="ebtn" style="font-weight:800">B</span><span class="ebtn" style="font-style:italic">I</span><span class="ebtn" style="text-decoration:underline">U</span><span class="sep"></span>
          <span class="ebtn">≡</span><span class="ebtn">≣</span><span class="sep"></span>
          <span class="ebtn">⇤</span><span class="ebtn">↔</span><span class="ebtn">⇥</span><span class="sep"></span>
          <span class="ebtn">🔗</span>
        </div>
        <div class="editor-area">Enter your content here&hellip;</div>
      </div>
    </div>

    <div class="cols-2" style="margin-bottom:18px">
      <div class="field"><div class="label">Start Date</div><input class="input" type="date" /></div>
      <div class="field">
        <div class="label">End Date</div>
        <input class="input" type="date" />
        <label class="check small" style="margin-top:4px"><input type="checkbox" class="checkbox" /> No end date - offer runs indefinitely</label>
      </div>
    </div>

    <div class="field" style="margin-bottom:18px">
      <div class="label" style="display:flex;align-items:center;gap:6px">Offer Access Route <span class="info info-tip" style="width:18px;height:18px;display:inline-grid" tabindex="0">${iconInfo()}<span class="bubble">How members will get access to this offer</span></span></div>
      <div class="cols-2">
        <div class="option-card disabled"><div class="row"><span class="title">Direct</span><span class="badge badge-soon">Soon</span></div><div class="desc">Immediately accessible with no extra steps</div></div>
        <div class="option-card disabled"><div class="row"><span class="title">Referral</span><span class="badge badge-soon">Soon</span></div><div class="desc">Requires a referral from another party</div></div>
        <div class="option-card selected"><div class="row"><span class="title">Application</span><span class="badge badge-active">Active</span></div><div class="desc">Applicant must submit a formal application</div></div>
        <div class="option-card disabled"><div class="row"><span class="title">Redeem</span><span class="badge badge-soon">Soon</span></div><div class="desc">Requires a code or voucher to unlock</div></div>
      </div>
    </div>

    <div class="field" style="margin-bottom:18px">
      <div class="label">Offer Image</div>
      <div class="dropzone">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="9" r="1.5" fill="currentColor"/><path d="M21 15l-5-5-11 11" stroke="currentColor" stroke-width="2"/></svg>
        </div>
        <div class="title">Drop an image here</div>
        <div class="hint">PNG, JPG, or WebP - max 2 MB</div>
        <button class="btn btn-secondary btn-sm">+ Browse Files</button>
      </div>
      <div class="help">Recommended: 1200 × 628 px</div>
    </div>

    <div class="field" style="margin-bottom:18px">
      <div class="label">Add Text to Image</div>
      <textarea class="textarea" style="min-height:60px" placeholder="Text to overlay on the offer image, e.g. '30% off for social workers'&hellip;"></textarea>
    </div>

    <button class="btn btn-primary" style="width:100%">✦ Generate Image with Hazel AI</button>
  `;
}

const BENEFITS = ["Help with living costs","Help when you are working","Help to find work","Help with education and training","Help with housing","Help setting up your home","Help to stay in your home","Help with travel","Help with health and wellbeing","Help with food","Help with bills","Help with money","Help in an emergency","Help with digital access","Help with independence","Help with documents and ID","Help with relationships and connections","Help with activities and interests","Help with confidence","Help to start a business","Help for parents and families"];

let benefitsSelected = new Set(["Help when you are working","Help with activities and interests"]);

function toggleBenefit(label){
  if(benefitsSelected.has(label)) benefitsSelected.delete(label); else benefitsSelected.add(label);
  refreshStepBody();
}
function benefitsSelectAll(){ benefitsSelected = new Set(BENEFITS); refreshStepBody(); }
function benefitsClearAll(){ benefitsSelected = new Set(); refreshStepBody(); }

function stepBenefits(){
  const row = (label)=>`
    <div class="select-row ${benefitsSelected.has(label)?'selected':''}" onclick="toggleBenefit('${label.replace(/'/g,"\\'")}')" role="checkbox" aria-checked="${benefitsSelected.has(label)}" tabindex="0">
      <div class="box">${iconCheck()}</div>
      <div class="title">${label}</div>
    </div>`;
  // Split by even/odd index rather than first-half/second-half: this
  // reproduces the exact same row-major reading order a 2-column CSS grid
  // produces (row 0: items 0,1 / row 1: items 2,3 / ...), while rendering
  // reliably via flexbox instead of depending on grid support.
  const left = BENEFITS.filter((_,i)=>i%2===0);
  const right = BENEFITS.filter((_,i)=>i%2===1);
  return `
    <div style="display:flex;align-items:flex-start;justify-content:space-between">
      <div><div class="h4" style="margin-bottom:2px">Benefits</div>
      <p class="intro" style="margin-bottom:6px">Select all the benefits this offer delivers. These will be used for future member matching.</p></div>
      <span class="pill-counter">${benefitsSelected.size} / ${BENEFITS.length} selected</span>
    </div>
    <div class="link-actions" style="margin-bottom:16px"><a href="#" onclick="benefitsSelectAll();return false;">Select all</a><span class="dot">&middot;</span><a href="#" onclick="benefitsClearAll();return false;">Clear all</a></div>
    <div class="cols-2">
      <div>${left.map(row).join('')}</div>
      <div>${right.map(row).join('')}</div>
    </div>
  `;
}

const CATEGORIES = [
  {label:"Housing & Accommodation", info:"Support finding and maintaining a safe, stable home."},
  {label:"Money & Financial Support", info:"Access to grants, benefits, and financial advice."},
  {label:"Education & Learning", info:"Courses, training, and educational opportunities."},
  {label:"Jobs, Training & Careers", info:"Employment support, apprenticeships, and career guidance."},
  {label:"Health & Wellbeing", info:"Physical and mental health services and support."},
  {label:"Relationships & Support Networks", info:"Mentoring, befriending, and community connections."},
  {label:"Community, Activities & Having Your Say", info:"Local events, activities, and participation opportunities."},
  {label:"Independent Living & Everyday Life", info:"Skills and support for living independently."},
  {label:"Advice, Rights & Leaving Care Support", info:"Legal advice, advocacy, and leaving care services."},
  {label:"Extra Support When You Need It", info:"Crisis support and additional specialist services."}
];
const CATEGORY_TAGS = {
  "Housing & Accommodation": ["Home Appliances","Flooring","Bedding","White Goods","Furniture","Cookware","Garden","Cleaning Products","Starter Packs","DIY and Tools","Home Insurance","Energy and Utilities","Broadband","Preparing to Move","Rent Guarantor","Help to Move","Hampers"],
  "Money & Financial Support": ["Credit Rating","Banking","Mortgages","Grants","Budgeting","Debt Advice","Benefits Calculator","Universal Credit","Savings","Insurance"],
  "Education & Learning": ["Schools","Tutoring","GCSEs","A-Levels","Online Courses","Apprenticeships","Literacy","Numeracy","Digital Skills","Languages","Evening Classes","Higher Education","Bursaries"],
  "Jobs, Training & Careers": ["Job Search","CV Writing","Interviews","Apprenticeships","Work Placement","Volunteering","Self Employment","Employer Schemes","Skills Bootcamps","Work Experience"],
  "Health & Wellbeing": ["GP","Dentist","Optician","Mental Health","Therapy","Sexual Health","Pharmacy","Substance Support","Gym & Fitness","Nutrition","Wellbeing Activities"],
  "Relationships & Support Networks": ["Mentoring","Befriending","Peer Support","Family Contact","Independent Visitor","Social Groups","Counselling","Advocacy","Support Worker"],
  "Community, Activities & Having Your Say": ["Events","Sports","Arts & Crafts","Music","Young Person Panels","Consultations","Co-production","Volunteering","Days Out","Holiday Activities"],
  "Independent Living & Everyday Life": ["Cooking","Budgeting Skills","Cleaning","Shopping","Digital Skills","Driving","Life Skills Courses","Time Management","Personal Hygiene"],
  "Advice, Rights & Leaving Care Support": ["Legal Aid","Rights Advice","Advocacy Services","Leaving Care Planning","Pathway Planning","Personal Adviser","Court Support","Immigration Advice"],
  "Extra Support When You Need It": ["Crisis Support","Emergency Accommodation","Food Banks","Domestic Abuse Support","Substance Support","Mental Health Crisis","Safe Houses","Emergency Contacts","Specialist Services"]
};

let categoriesSelected = new Set(["Housing & Accommodation"]);
let tagsSelected = { "Housing & Accommodation": new Set(["Home Appliances"]) };
let shareWithCouncil = null; // null | 'yes' | 'no' - deselected by default
function setShareWithCouncil(val){
  shareWithCouncil = (shareWithCouncil === val) ? null : val;
  refreshStepBody();
}

function toggleCategory(label){
  if(categoriesSelected.has(label)) categoriesSelected.delete(label); else categoriesSelected.add(label);
  refreshStepBody();
}
function toggleTag(cat, tag){
  if(!tagsSelected[cat]) tagsSelected[cat] = new Set();
  if(tagsSelected[cat].has(tag)) tagsSelected[cat].delete(tag); else tagsSelected[cat].add(tag);
  refreshStepBody();
}

function stepCategories(){
  const catsWithTags = [...categoriesSelected].filter(c => (CATEGORY_TAGS[c]||[]).length);
  return `
    <div class="h4">Offer Categories</div>
    <p class="intro">Choose the categories this offer applies to. Select one or more.</p>
    ${CATEGORIES.map((c)=>{
      const active = categoriesSelected.has(c.label);
      return `
      <div class="select-row ${active?'selected':''}" onclick="toggleCategory('${c.label.replace(/'/g,"\\'")}')" role="checkbox" aria-checked="${active}" tabindex="0">
        <div class="box">${iconCheck()}</div>
        <div class="title">${c.label}</div>
        <div class="info info-tip" tabindex="0" onclick="event.stopPropagation()">${iconInfo()}<span class="bubble">${c.info}</span></div>
      </div>`;}).join('')}

    ${catsWithTags.map(cat => `
    <div class="subpanel">
      <div class="subpanel-header">
        <div class="title">${iconCheck()} ${cat}</div>
        <div class="meta">Offer Tags</div>
      </div>
      <div class="subpanel-body">
        <p class="small" style="margin-top:0">Add useful search tags so members can find the offer in more than one way.</p>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          ${CATEGORY_TAGS[cat].map(t=>{
            const on = tagsSelected[cat] && tagsSelected[cat].has(t);
            return `<span class="tag-pill ${on?'selected':''}" onclick="toggleTag('${cat.replace(/'/g,"\\'")}','${t.replace(/'/g,"\\'")}')">${on?iconCheck():''} ${t}</span>`;
          }).join('')}
        </div>
      </div>
    </div>`).join('')}

    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn-dashed btn-sm">
        <svg viewBox="0 0 14 14" fill="none" width="14" height="14"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Create a category
      </button>
      <button class="btn btn-dashed btn-sm">
        <svg viewBox="0 0 14 14" fill="none" width="14" height="14"><path d="M1 9.5 7.5 3 11 6.5 4.5 13H1V9.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M9.5 1.5 12.5 4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        Create Tags
      </button>
    </div>

    <div class="panel-dark">
      <div class="head">
        <div class="head-left">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="m9 12 2 2 4-4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="9" stroke="#fff" stroke-width="2"/></svg></div>
          <div class="title">Share offer with local council?</div>
        </div>
        <div class="info-btn info-tip" tabindex="0">${iconInfo()}<span class="bubble">Councils can broker this offer to residents in their area</span></div>
      </div>
      <div class="desc">Allow a local council to view, share and broker this offer in their area.</div>
      <div class="segmented">
        <button class="seg-btn yes on-dark ${shareWithCouncil==='yes'?'on':''}" onclick="setShareWithCouncil('yes')">${iconCheck()} Yes</button>
        <button class="seg-btn on-dark ${shareWithCouncil==='no'?'on':''}" onclick="setShareWithCouncil('no')">${iconX()} No</button>
      </div>
      <div class="field-label">Select local authority</div>
      <div class="searchbar" ${shareWithCouncil!=='yes' ? 'style="opacity:.5"' : ''}>
        <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input placeholder="Search for a local authority&hellip;" ${shareWithCouncil!=='yes' ? 'disabled' : ''} />
      </div>
    </div>
  `;
}

const RENDERERS = [stepWho, stepEligibility, stepDetails, stepBenefits, stepCategories];

function render(){
  renderStepper();
  renderFooter();
  document.getElementById('stepBody').innerHTML = RENDERERS[current]();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* Toggles the "Includes" accordion on an eligibility card: flips the
   chevron and shows/hides the detail panel that sits below the row. */
function toggleIncludes(btn){
  const card = btn.closest('.elig-card');
  const panel = card ? card.querySelector('.includes-panel') : null;
  const isOpen = btn.classList.toggle('open');
  if(panel) panel.hidden = !isOpen;
}

document.getElementById('btnNext').addEventListener('click', ()=>{
  if(current < STEPS.length-1){ current++; render(); }
});
document.getElementById('btnBack').addEventListener('click', ()=>{
  if(current > 0){ current--; render(); }
});

render();
</script>
</body>
</html>
